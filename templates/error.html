<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ code }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .error-card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .error-icon { font-size: 4rem; color: #dc3545; }
    </style>
</head>
<body>
    {% extends "layout.html" %}

    {% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card error-card text-center p-5">
                    <i class="bi bi-exclamation-triangle error-icon mb-4"></i>
                    <h1 class="display-1 fw-bold text-danger">{{ code }}</h1>
                    <h3 class="mb-3">{{ message }}</h3>
                    <p class="text-muted mb-4">Ha ocurrido un error. Por favor, intenta de nuevo más tarde.</p>
                    <a href="{{ url_for('index') }}" class="btn btn-primary">
                        <i class="bi bi-house"></i> Volver al Inicio
                    </a>
                </div>
            </div>
        </div>
    </div>
    {% endblock %}
</html>
